general.import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
  # "~/.config/alacritty/dracula.toml"
  # "~/.config/alacritty/catppuccin-frappe.toml"
]

[window]
opacity = 0.89

[window.dimensions]
columns = 130
lines = 30

[window.padding]
x = 5
y = 5

[font]

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Bold Italic"
